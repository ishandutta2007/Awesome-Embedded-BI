<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#070a13; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background & Accent Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0d1429" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.4)" />
    </linearGradient>

    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.35)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.0)" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="barGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.15)" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)" />
    </pattern>
  </defs>

  <style>
    /* CSS Animations for Dynamic Feel */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.18) translate(15px, -15px); opacity: 0.75; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(0.9) translate(-20px, 20px); opacity: 0.65; }
    }
    @keyframes livePulse {
      0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 2px #34d399); }
      50% { transform: scale(1.35); opacity: 0.4; filter: drop-shadow(0 0 8px #34d399); }
    }
    @keyframes chartFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatWidget {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes barPulse1 {
      0%, 100% { height: 60px; y: 220px; }
      50% { height: 78px; y: 202px; }
    }
    @keyframes barPulse2 {
      0%, 100% { height: 95px; y: 185px; }
      50% { height: 75px; y: 205px; }
    }
    @keyframes barPulse3 {
      0%, 100% { height: 45px; y: 235px; }
      50% { height: 85px; y: 195px; }
    }
    @keyframes barPulse4 {
      0%, 100% { height: 110px; y: 170px; }
      50% { height: 90px; y: 190px; }
    }
    @keyframes barPulse5 {
      0%, 100% { height: 75px; y: 205px; }
      50% { height: 115px; y: 165px; }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    @keyframes nodePing {
      0%, 100% { r: 4px; opacity: 0.9; }
      50% { r: 6.5px; opacity: 0.3; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 900px 300px; }
    .live-dot { animation: livePulse 2s ease-in-out infinite; transform-origin: center; }
    .chart-line { stroke-dasharray: 600; animation: chartFlow 4s ease-out forwards; }
    .stream-line { stroke-dasharray: 6, 6; animation: streamFlow 2s linear infinite; }
    .dashboard-mockup { animation: floatWidget 6s ease-in-out infinite; }
    .bar-1 { animation: barPulse1 4s ease-in-out infinite; }
    .bar-2 { animation: barPulse2 4.5s ease-in-out infinite; }
    .bar-3 { animation: barPulse3 3.8s ease-in-out infinite; }
    .bar-4 { animation: barPulse4 5.2s ease-in-out infinite; }
    .bar-5 { animation: barPulse5 4.2s ease-in-out infinite; }
    .ping-node { animation: nodePing 2.5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />
  <rect width="1200" height="420" fill="url(#dots)" opacity="0.6" />

  <!-- Ambient Glowing Orbs -->
  <g filter="url(#softGlow)">
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#38bdf8" opacity="0.22" />
    <circle class="orb-2" cx="960" cy="280" r="160" fill="#818cf8" opacity="0.25" />
    <circle cx="600" cy="380" r="110" fill="#c084fc" opacity="0.15" />
  </g>

  <!-- Left Side: Typography & Metadata -->
  <g transform="translate(60, 50)">
    <!-- Top Pill / Status Badge -->
    <g transform="translate(0, 10)">
      <rect width="320" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle class="live-dot" cx="16" cy="14" r="4.5" fill="#34d399" />
      <text x="30" y="18" fill="#e2e8f0" font-size="11.5" font-weight="600" letter-spacing="1">CURATED EMBEDDED ANALYTICS</text>
      <rect x="235" y="5" width="75" height="18" rx="9" fill="rgba(56, 189, 248, 0.25)" />
      <text x="246" y="17" fill="#38bdf8" font-size="9.5" font-weight="700" letter-spacing="0.5">DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 82)">
      <text font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#primaryTextGrad)" filter="drop-shadow(0 4px 12px rgba(56, 189, 248, 0.2))">
        Awesome Embedded BI
      </text>
    </g>

    <!-- Subtitle / Mission Statement -->
    <g transform="translate(0, 122)">
      <text font-size="15.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
        A curated landscape of customer-facing analytics, white-label BI,
      </text>
      <text y="24" font-size="15.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
        semantic layers, multi-tenant SDKs, and headless data architectures.
      </text>
    </g>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 195)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="28" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#38bdf8" />
        <text x="22" y="18" fill="#cbd5e1" font-size="11.5" font-weight="600">SaaS BI &amp; SDKs</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(145, 0)">
        <rect width="145" height="28" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#818cf8" />
        <text x="22" y="18" fill="#cbd5e1" font-size="11.5" font-weight="600">Semantic Layers</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(300, 0)">
        <rect width="138" height="28" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#c084fc" />
        <text x="22" y="18" fill="#cbd5e1" font-size="11.5" font-weight="600">Multi-Tenant RLS</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(448, 0)">
        <rect width="105" height="28" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#f472b6" />
        <text x="22" y="18" fill="#cbd5e1" font-size="11.5" font-weight="600">Open Source</text>
      </g>
    </g>

    <!-- Key Metrics / Footer Highlights -->
    <g transform="translate(0, 260)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#38bdf8" font-size="19" font-weight="800">40+</text>
        <text x="0" y="17" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.5">CURATED PLATFORMS</text>
      </g>
      <line x1="140" y1="-8" x2="140" y2="22" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <g transform="translate(160, 0)">
        <text x="0" y="0" fill="#818cf8" font-size="19" font-weight="800">$108B</text>
        <text x="0" y="17" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.5">MARKET FORECAST</text>
      </g>
      <line x1="300" y1="-8" x2="300" y2="22" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <g transform="translate(320, 0)">
        <text x="0" y="0" fill="#34d399" font-size="19" font-weight="800">100%</text>
        <text x="0" y="17" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.5">FREE &amp; OPEN SOURCE</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Interactive Mockup / Analytics Widget -->
  <g class="dashboard-mockup" transform="translate(680, 42)">
    <!-- Dashboard Card Container -->
    <rect width="470" height="336" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))" />
    
    <!-- Window Header -->
    <g transform="translate(18, 16)">
      <!-- MacOS Window Controls -->
      <circle cx="4" cy="8" r="4.5" fill="#ef4444" opacity="0.85" />
      <circle cx="18" cy="8" r="4.5" fill="#eab308" opacity="0.85" />
      <circle cx="32" cy="8" r="4.5" fill="#22c55e" opacity="0.85" />
      
      <!-- Tab & Title -->
      <rect x="58" y="0" width="160" height="18" rx="5" fill="rgba(255, 255, 255, 0.05)" />
      <text x="70" y="12.5" fill="#94a3b8" font-size="10" font-weight="600">embedded_bi_core.ts</text>

      <!-- Live Stream Pill -->
      <rect x="330" y="0" width="95" height="18" rx="9" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1" />
      <circle class="live-dot" cx="340" cy="9" r="3.5" fill="#22c55e" />
      <text x="350" y="12.5" fill="#4ade80" font-size="9.5" font-weight="700" letter-spacing="0.5">LIVE SYNC</text>
    </g>

    <line x1="0" y1="44" x2="470" y2="44" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />

    <!-- Mini KPI Stat Cards -->
    <g transform="translate(18, 56)">
      <!-- KPI 1 -->
      <rect width="135" height="52" rx="8" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
      <text x="12" y="18" fill="#64748b" font-size="9.5" font-weight="600">QUERY LATENCY</text>
      <text x="12" y="38" fill="#38bdf8" font-size="16" font-weight="800">12.4 ms</text>
      <text x="82" y="38" fill="#34d399" font-size="10" font-weight="700">↓ 42%</text>

      <!-- KPI 2 -->
      <g transform="translate(148, 0)">
        <rect width="135" height="52" rx="8" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1" />
        <text x="12" y="18" fill="#64748b" font-size="9.5" font-weight="600">ACTIVE TENANTS</text>
        <text x="12" y="38" fill="#818cf8" font-size="16" font-weight="800">2,840</text>
        <text x="78" y="38" fill="#34d399" font-size="10" font-weight="700">↑ 18%</text>
      </g>

      <!-- KPI 3 -->
      <g transform="translate(296, 0)">
        <rect width="138" height="52" rx="8" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" />
        <text x="12" y="18" fill="#64748b" font-size="9.5" font-weight="600">DATA EVENTS / SEC</text>
        <text x="12" y="38" fill="#c084fc" font-size="16" font-weight="800">450K</text>
        <text x="78" y="38" fill="#38bdf8" font-size="10" font-weight="700">● 99.9%</text>
      </g>
    </g>

    <!-- Main Chart Section: Embedded Analytics Line Chart -->
    <g transform="translate(18, 120)">
      <rect width="434" height="120" rx="10" fill="rgba(10, 15, 30, 0.6)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      
      <!-- Chart Grid Lines -->
      <line x1="20" y1="25" x2="414" y2="25" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4,4" />
      <line x1="20" y1="55" x2="414" y2="55" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4,4" />
      <line x1="20" y1="85" x2="414" y2="85" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4,4" />

      <!-- Area Under Curve -->
      <path d="M 20 95 Q 80 40, 140 70 T 260 30 T 350 50 T 414 20 L 414 110 L 20 110 Z" fill="url(#chartAreaGrad)" />

      <!-- Primary Dynamic Chart Curve -->
      <path class="chart-line" d="M 20 95 Q 80 40, 140 70 T 260 30 T 350 50 T 414 20" fill="none" stroke="url(#chartLineGrad)" stroke-width="3" filter="url(#glow)" />

      <!-- Moving Stream / Secondary Sparkline -->
      <path class="stream-line" d="M 20 102 Q 80 65, 140 85 T 260 55 T 350 70 T 414 45" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.8" />

      <!-- Glowing Data Points / Nodes -->
      <circle class="ping-node" cx="140" cy="70" r="4.5" fill="#38bdf8" filter="url(#glow)" />
      <circle class="ping-node" cx="260" cy="30" r="5" fill="#818cf8" filter="url(#glow)" />
      <circle class="ping-node" cx="414" cy="20" r="5" fill="#ec4899" filter="url(#glow)" />

      <!-- Chart Tooltip / Annotation -->
      <g transform="translate(210, 8)">
        <rect width="84" height="20" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(129, 140, 248, 0.5)" stroke-width="1" />
        <text x="8" y="13.5" fill="#e2e8f0" font-size="9" font-weight="700">Peak: 1.48M Qps</text>
      </g>
    </g>

    <!-- Bottom Chart Section: Multi-Tenant Bar Analytics -->
    <g transform="translate(18, 252)">
      <rect width="434" height="68" rx="8" fill="rgba(10, 15, 30, 0.5)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      
      <text x="14" y="20" fill="#64748b" font-size="9.5" font-weight="700" letter-spacing="0.5">CROSS-TENANT RESOURCE ISOLATION</text>
      
      <!-- Bars with dynamic heights -->
      <!-- Bar Group -->
      <g transform="translate(14, -180)">
        <!-- Bar 1 -->
        <rect class="bar-1" x="180" y="220" width="18" height="24" rx="3" fill="url(#barGrad1)" />
        <text x="181" y="240" fill="#94a3b8" font-size="8" font-weight="600">T1</text>

        <!-- Bar 2 -->
        <rect class="bar-2" x="210" y="210" width="18" height="34" rx="3" fill="url(#barGrad2)" />
        <text x="211" y="240" fill="#94a3b8" font-size="8" font-weight="600">T2</text>

        <!-- Bar 3 -->
        <rect class="bar-3" x="240" y="225" width="18" height="19" rx="3" fill="url(#barGrad3)" />
        <text x="241" y="240" fill="#94a3b8" font-size="8" font-weight="600">T3</text>

        <!-- Bar 4 -->
        <rect class="bar-4" x="270" y="200" width="18" height="44" rx="3" fill="url(#barGrad4)" />
        <text x="271" y="240" fill="#94a3b8" font-size="8" font-weight="600">T4</text>

        <!-- Bar 5 -->
        <rect class="bar-5" x="300" y="215" width="18" height="29" rx="3" fill="url(#barGrad5)" />
        <text x="301" y="240" fill="#94a3b8" font-size="8" font-weight="600">T5</text>

        <!-- Bar 6 -->
        <rect class="bar-2" x="330" y="208" width="18" height="36" rx="3" fill="url(#barGrad1)" />
        <text x="331" y="240" fill="#94a3b8" font-size="8" font-weight="600">T6</text>

        <!-- Bar 7 -->
        <rect class="bar-4" x="360" y="218" width="18" height="26" rx="3" fill="url(#barGrad3)" />
        <text x="361" y="240" fill="#94a3b8" font-size="8" font-weight="600">T7</text>

        <!-- Bar 8 -->
        <rect class="bar-1" x="390" y="202" width="18" height="42" rx="3" fill="url(#barGrad5)" />
        <text x="391" y="240" fill="#94a3b8" font-size="8" font-weight="600">T8</text>
      </g>

      <!-- Status Indicator -->
      <g transform="translate(14, 40)">
        <circle cx="4" cy="4" r="3" fill="#38bdf8" />
        <text x="12" y="7" fill="#94a3b8" font-size="9" font-weight="500">Auto-scaling RLS partition filter active</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Border Glow -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryTextGrad)" opacity="0.8" />
</svg>
