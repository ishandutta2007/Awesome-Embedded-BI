<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Animated Gradient for Main Title -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="areaChartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.2"/>
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.25"/>
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes radarSweep {
        0% { transform: translateX(0px); opacity: 0.1; }
        50% { opacity: 0.9; }
        100% { transform: translateX(350px); opacity: 0.1; }
      }
      .cockpit-card { animation: floatSlow 7s ease-in-out infinite; }
      .radar-line { animation: radarSweep 5s linear infinite; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Ambient Light Halos -->
  <circle cx="200" cy="80" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="120" r="180" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>
  <circle cx="600" cy="320" r="140" fill="#a855f7" opacity="0.08" filter="url(#glow)"/>

  <!-- Outer Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- ==================== LAYER 1: TOP BADGE ==================== -->
  <g transform="translate(450, 24)">
    <rect width="300" height="28" rx="14" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="150" y="18" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700" letter-spacing="1.2" class="font-sans">
      CURATED DEVELOPER DIRECTORY
    </text>
  </g>

  <!-- ==================== LAYER 2: HERO TITLE ==================== -->
  <text x="600" y="96" text-anchor="middle" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" class="font-sans">
    AWESOME EMBEDDED BI
  </text>

  <!-- ==================== LAYER 3: SUBTITLE ==================== -->
  <text x="600" y="128" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="500" letter-spacing="0.3" class="font-sans">
    Customer-Facing Analytics • Semantic Layers • Headless BI APIs • Multi-Tenant SDKs
  </text>

  <!-- ==================== LAYER 4: FEATURE PILLS ==================== -->
  <g transform="translate(210, 150)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="30" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="16" cy="15" r="3.5" fill="#38bdf8"/>
      <text x="96" y="19" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-weight="600" class="font-sans">Multi-Tenant RLS</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(200, 0)">
      <rect width="180" height="30" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="16" cy="15" r="3.5" fill="#818cf8"/>
      <text x="96" y="19" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-weight="600" class="font-sans">Headless BI APIs</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(400, 0)">
      <rect width="180" height="30" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="16" cy="15" r="3.5" fill="#c084fc"/>
      <text x="96" y="19" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-weight="600" class="font-sans">Interactive Dashboards</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(600, 0)">
      <rect width="180" height="30" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#34d399" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="16" cy="15" r="3.5" fill="#34d399"/>
      <text x="96" y="19" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-weight="600" class="font-sans">SaaS &amp; Open-Source</text>
    </g>
  </g>

  <!-- ==================== LAYER 5: INTERACTIVE CONSOLE COCKPIT ==================== -->
  <g class="cockpit-card" transform="translate(60, 202)">
    <!-- Cockpit Outer Frame -->
    <rect width="1080" height="132" rx="12" fill="#0c1322" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2"/>
    <rect width="1080" height="132" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Column Dividers -->
    <line x1="330" y1="14" x2="330" y2="118" stroke="#1e293b" stroke-width="1"/>
    <line x1="750" y1="14" x2="750" y2="118" stroke="#1e293b" stroke-width="1"/>

    <!-- ---------- COLUMN 1: TELEMETRY & SECURITY ---------- -->
    <!-- Status Row -->
    <g transform="translate(24, 20)">
      <circle cx="6" cy="6" r="4.5" fill="#10b981">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="10" fill="#34d399" font-size="11" font-weight="700" letter-spacing="0.5" class="font-mono">
        STATUS: MULTI-TENANT ACTIVE
      </text>
    </g>

    <!-- Latency Stat -->
    <g transform="translate(24, 52)">
      <text x="0" y="0" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.8" class="font-sans">QUERY LATENCY</text>
      <text x="0" y="24" fill="#38bdf8" font-size="20" font-weight="900" class="font-mono">12.4 ms</text>
      
      <rect x="110" y="8" width="130" height="20" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8"/>
      <text x="175" y="22" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700" class="font-mono">▲ 99.9% RLS HIT</text>
    </g>

    <!-- Context Info -->
    <g transform="translate(24, 106)">
      <text x="0" y="0" fill="#64748b" font-size="10.5" font-weight="500" class="font-mono">
        JWT Auth • Token Isolation • RLS
      </text>
    </g>

    <!-- ---------- COLUMN 2: REAL-TIME CHART PIPELINE ---------- -->
    <text x="540" y="24" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1" class="font-sans">
      REAL-TIME ANALYTICS STREAM
    </text>

    <!-- Equalizer / Bar Engine (Left inside Col 2) -->
    <g transform="translate(355, 38)">
      <!-- Bar 1 -->
      <rect x="0" y="32" width="8" height="38" rx="2" fill="url(#cyanBlue)">
        <animate attributeName="height" values="38;56;22;38" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="32;14;48;32" dur="3s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 2 -->
      <rect x="13" y="18" width="8" height="52" rx="2" fill="url(#purplePink)">
        <animate attributeName="height" values="52;28;62;52" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;42;8;18" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 3 -->
      <rect x="26" y="26" width="8" height="44" rx="2" fill="url(#emeraldTeal)">
        <animate attributeName="height" values="44;64;34;44" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="26;6;36;26" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 4 -->
      <rect x="39" y="40" width="8" height="30" rx="2" fill="url(#cyanBlue)">
        <animate attributeName="height" values="30;50;20;30" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="40;20;50;40" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 5 -->
      <rect x="52" y="14" width="8" height="56" rx="2" fill="url(#purplePink)">
        <animate attributeName="height" values="56;35;65;56" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="14;35;5;14" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 6 -->
      <rect x="65" y="24" width="8" height="46" rx="2" fill="url(#emeraldTeal)">
        <animate attributeName="height" values="46;58;25;46" dur="2.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="24;12;45;24" dur="2.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Area Chart & Smooth Wave (Right inside Col 2) -->
    <g transform="translate(450, 38)">
      <!-- Grid lines -->
      <line x1="0" y1="18" x2="270" y2="18" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="0" y1="42" x2="270" y2="42" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="0" y1="66" x2="270" y2="66" stroke="#1e293b" stroke-width="0.8"/>

      <!-- Area Chart Fill -->
      <path d="M 0 55 Q 50 35, 90 42 T 180 18 T 270 10 L 270 70 L 0 70 Z" fill="url(#areaChartFill)"/>
      
      <!-- Chart Smooth Line -->
      <path d="M 0 55 Q 50 35, 90 42 T 180 18 T 270 10" fill="none" stroke="url(#titleGrad)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Pulse Data Nodes -->
      <circle cx="90" cy="42" r="4" fill="#38bdf8" stroke="#0c1322" stroke-width="1.5">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="18" r="4" fill="#818cf8" stroke="#0c1322" stroke-width="1.5">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="270" cy="10" r="4.5" fill="#c084fc" stroke="#0c1322" stroke-width="1.5">
        <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Sweeping Radar Scanner -->
      <line class="radar-line" x1="0" y1="5" x2="0" y2="68" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    </g>

    <!-- ---------- COLUMN 3: DIRECTORY BENCHMARKS ---------- -->
    <!-- Benchmark 1 -->
    <g transform="translate(775, 22)">
      <text x="0" y="16" fill="#38bdf8" font-size="18" font-weight="900" class="font-mono">100+</text>
      <text x="64" y="15" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Curated Platforms &amp; Tools</text>
    </g>

    <!-- Benchmark 2 -->
    <g transform="translate(775, 58)">
      <text x="0" y="16" fill="#a855f7" font-size="18" font-weight="900" class="font-mono">100%</text>
      <text x="64" y="15" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Verified Pricing &amp; Limits</text>
    </g>

    <!-- Benchmark 3 -->
    <g transform="translate(775, 94)">
      <text x="0" y="16" fill="#34d399" font-size="18" font-weight="900" class="font-mono">$108B</text>
      <text x="64" y="15" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Global Market by 2030</text>
    </g>
  </g>
</svg>
