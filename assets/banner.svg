<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="40%" stop-color="#0b1124"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes floatCardAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(4px); }
      }
      @keyframes dashDraw {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: translateX(0px); opacity: 0.1; }
        50% { opacity: 0.8; }
        100% { transform: translateX(450px); opacity: 0.1; }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 42px; y: 68px; }
        50% { height: 62px; y: 48px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 68px; y: 42px; }
        50% { height: 45px; y: 65px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 85px; y: 25px; }
        50% { height: 98px; y: 12px; }
      }
      @keyframes barGrow4 {
        0%, 100% { height: 55px; y: 55px; }
        50% { height: 75px; y: 35px; }
      }
      @keyframes barGrow5 {
        0%, 100% { height: 92px; y: 18px; }
        50% { height: 70px; y: 40px; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4.5px; opacity: 0.9; }
        50% { r: 6.5px; opacity: 0.5; }
      }

      .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
      .floating-widget { animation: floatCard 6s ease-in-out infinite; }
      .live-dot { animation: blinkDot 2s ease-in-out infinite; }
      .chart-line { stroke-dasharray: 600; animation: dashDraw 4s ease-out forwards; }
      .scan-line { animation: radarSweep 6s linear infinite; }
      .anim-bar-1 { animation: barGrow1 4s ease-in-out infinite; }
      .anim-bar-2 { animation: barGrow2 4.5s ease-in-out infinite; }
      .anim-bar-3 { animation: barGrow3 3.8s ease-in-out infinite; }
      .anim-bar-4 { animation: barGrow4 4.2s ease-in-out infinite; }
      .anim-bar-5 { animation: barGrow5 3.5s ease-in-out infinite; }
      .pulse-node { animation: nodePulse 2.5s ease-in-out infinite; }
      .bg-orb-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
      .bg-orb-2 { animation: pulseGlow 10s ease-in-out infinite 2s; transform-origin: center; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>

  <!-- Glowing Atmosphere Orbs -->
  <circle class="bg-orb-1" cx="220" cy="110" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle class="bg-orb-2" cx="1020" cy="190" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle class="bg-orb-1" cx="600" cy="340" r="150" fill="#a855f7" opacity="0.1" filter="url(#glow)"/>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ==================== LEFT HERO SECTION ==================== -->

  <!-- Top Pill / Badge -->
  <g transform="translate(60, 36)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="15" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" fill="#93c5fd" font-size="11.5" font-weight="700" letter-spacing="1.2" class="font-sans">CURATED DEVELOPER DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(60, 118)">
    <text x="0" y="0" fill="url(#primaryGrad)" font-size="46" font-weight="900" letter-spacing="-0.5" class="font-sans" filter="url(#subtleGlow)">
      AWESOME EMBEDDED BI
    </text>
  </g>

  <!-- Tagline / Subtitle -->
  <g transform="translate(60, 154)">
    <text x="0" y="0" fill="#e2e8f0" font-size="16.5" font-weight="500" class="font-sans">
      The Modern Stack for Customer-Facing Analytics &amp; Semantic Layers
    </text>
    <text x="0" y="24" fill="#94a3b8" font-size="13.5" font-weight="400" class="font-sans">
      Interactive Dashboards • Headless BI APIs • Multi-Tenant RLS • Turnkey &amp; OSS
    </text>
  </g>

  <!-- Feature Pills Badges -->
  <g transform="translate(60, 218)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="138" height="32" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="16" cy="16" r="3.5" fill="#38bdf8"/>
      <text x="28" y="20" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Multi-Tenant RLS</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(148, 0)">
      <rect width="130" height="32" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#818cf8" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="16" cy="16" r="3.5" fill="#818cf8"/>
      <text x="28" y="20" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">SDKs &amp; APIs</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(288, 0)">
      <rect width="142" height="32" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#c084fc" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="16" cy="16" r="3.5" fill="#c084fc"/>
      <text x="28" y="20" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Semantic Modeling</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(440, 0)">
      <rect width="112" height="32" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#34d399" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="16" cy="16" r="3.5" fill="#34d399"/>
      <text x="28" y="20" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">SaaS &amp; OSS</text>
    </g>
  </g>

  <!-- Key Metrics Row (Left Bottom) -->
  <g transform="translate(60, 280)">
    <!-- Divider line -->
    <line x1="0" y1="0" x2="492" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Metric 1 -->
    <g transform="translate(0, 18)">
      <text x="0" y="16" fill="#38bdf8" font-size="20" font-weight="800" class="font-sans">100+</text>
      <text x="0" y="34" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.5" class="font-sans">PLATFORMS &amp; TOOLS</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(150, 18)">
      <text x="0" y="16" fill="#a78bfa" font-size="20" font-weight="800" class="font-sans">100%</text>
      <text x="0" y="34" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.5" class="font-sans">VERIFIED PRICING</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(290, 18)">
      <text x="0" y="16" fill="#34d399" font-size="20" font-weight="800" class="font-sans">$108B+</text>
      <text x="0" y="34" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.5" class="font-sans">MARKET BY 2030</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(430, 18)">
      <text x="0" y="16" fill="#fbbf24" font-size="20" font-weight="800" class="font-sans">Free/OSS</text>
      <text x="0" y="34" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.5" class="font-sans">STACK GUIDES</text>
    </g>
  </g>

  <!-- ==================== RIGHT INTERACTIVE DASHBOARD WIDGET ==================== -->

  <g class="floating-widget" transform="translate(620, 36)">
    <!-- Main Glass Card Container -->
    <rect width="520" height="308" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
    <rect width="520" height="308" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Window Header Bar -->
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 506 0 C 513.732 0 520 6.268 520 14 L 520 38 L 0 38 Z" fill="#1e293b" fill-opacity="0.6"/>
    <line x1="0" y1="38" x2="520" y2="38" stroke="#334155" stroke-width="0.8"/>

    <!-- Window Control Dots -->
    <circle cx="20" cy="19" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="52" cy="19" r="5" fill="#10b981" opacity="0.85"/>

    <!-- Header Title & Status -->
    <text x="75" y="23" fill="#94a3b8" font-size="11.5" font-weight="600" class="font-mono">sdk.analytics.mount("#app-embed")</text>

    <g transform="translate(415, 12)">
      <rect width="90" height="16" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="0.8"/>
      <circle class="live-dot" cx="10" cy="8" r="3.5" fill="#34d399"/>
      <text x="20" y="12" fill="#34d399" font-size="9.5" font-weight="700" letter-spacing="0.5" class="font-mono">LIVE SYNC</text>
    </g>

    <!-- Mini KPI Stat Cards (3 Cards) -->
    <!-- KPI 1 -->
    <g transform="translate(20, 50)">
      <rect width="150" height="52" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" class="font-sans">QUERY LATENCY</text>
      <text x="12" y="39" fill="#38bdf8" font-size="17" font-weight="800" class="font-mono">14.2 ms</text>
      <path d="M 108 34 L 118 24 L 126 28 L 138 18" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
      <polygon points="138,18 133,19 136,23" fill="#34d399"/>
    </g>

    <!-- KPI 2 -->
    <g transform="translate(185, 50)">
      <rect width="150" height="52" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" class="font-sans">THROUGHPUT</text>
      <text x="12" y="39" fill="#818cf8" font-size="17" font-weight="800" class="font-mono">2.4M/s</text>
      <text x="96" y="36" fill="#34d399" font-size="10" font-weight="700" class="font-sans">+28.4%</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(350, 50)">
      <rect width="150" height="52" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" class="font-sans">ACTIVE TENANTS</text>
      <text x="12" y="39" fill="#c084fc" font-size="17" font-weight="800" class="font-mono">8,420</text>
      <circle cx="132" cy="32" r="4" fill="#10b981">
        <animate attributeName="r" values="3;5.5;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main Visual Chart Area -->
    <g transform="translate(20, 114)">
      <!-- Chart Inner Background -->
      <rect width="480" height="135" rx="8" fill="#0b1329" fill-opacity="0.5" stroke="#1e293b" stroke-width="0.8"/>

      <!-- Chart Grid Lines -->
      <line x1="15" y1="30" x2="465" y2="30" stroke="#334155" stroke-width="0.5" stroke-dasharray="3,3" stroke-opacity="0.5"/>
      <line x1="15" y1="65" x2="465" y2="65" stroke="#334155" stroke-width="0.5" stroke-dasharray="3,3" stroke-opacity="0.5"/>
      <line x1="15" y1="100" x2="465" y2="100" stroke="#334155" stroke-width="0.5" stroke-dasharray="3,3" stroke-opacity="0.5"/>

      <!-- Dynamic Bar Chart Column Group (Left side of chart) -->
      <g transform="translate(25, 0)">
        <!-- Bar 1 -->
        <rect class="anim-bar-1" x="10" y="68" width="16" height="42" rx="3" fill="url(#accentCyan)"/>
        <!-- Bar 2 -->
        <rect class="anim-bar-2" x="35" y="42" width="16" height="68" rx="3" fill="url(#primaryGrad)"/>
        <!-- Bar 3 -->
        <rect class="anim-bar-3" x="60" y="25" width="16" height="85" rx="3" fill="url(#accentPurple)"/>
        <!-- Bar 4 -->
        <rect class="anim-bar-4" x="85" y="55" width="16" height="55" rx="3" fill="url(#accentCyan)"/>
        <!-- Bar 5 -->
        <rect class="anim-bar-5" x="110" y="18" width="16" height="92" rx="3" fill="url(#accentEmerald)"/>
      </g>

      <!-- Area Chart Fill & Smooth Line (Right side of chart) -->
      <path d="M 170 110 Q 210 85, 250 90 T 320 40 T 390 55 T 465 20 L 465 110 Z" fill="url(#chartAreaGrad)"/>
      <path class="chart-line" d="M 170 110 Q 210 85, 250 90 T 320 40 T 390 55 T 465 20" fill="none" stroke="url(#chartLineGrad)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Animated Data Points along Line -->
      <circle class="pulse-node" cx="250" cy="90" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
      <circle class="pulse-node" cx="320" cy="40" r="4.5" fill="#818cf8" stroke="#0f172a" stroke-width="1.5"/>
      <circle class="pulse-node" cx="390" cy="55" r="4.5" fill="#c084fc" stroke="#0f172a" stroke-width="1.5"/>
      <circle class="pulse-node" cx="465" cy="20" r="5" fill="#ec4899" stroke="#0f172a" stroke-width="1.5"/>

      <!-- Scan Line Effect across chart -->
      <line class="scan-line" x1="15" y1="10" x2="15" y2="120" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    </g>

    <!-- Bottom Status Bar (Metadata & Security Context) -->
    <g transform="translate(20, 260)">
      <rect width="480" height="34" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="0.6"/>
      
      <!-- Shield Icon -->
      <g transform="translate(12, 10)">
        <path d="M 7 1 L 1 3.5 L 1 8 C 1 11.5 3.5 14.5 7 15.5 C 10.5 14.5 13 11.5 13 8 L 13 3.5 Z" fill="none" stroke="#10b981" stroke-width="1.4"/>
        <path d="M 4.5 8 L 6.5 10 L 9.5 6" fill="none" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      
      <text x="34" y="21" fill="#cbd5e1" font-size="11" font-weight="500" class="font-mono">
        <tspan fill="#34d399">RLS Isolated</tspan> | org_id: <tspan fill="#93c5fd">acme-corp</tspan> | Cache: <tspan fill="#fbbf24">HIT (0.8ms)</tspan>
      </text>

      <text x="410" y="21" fill="#64748b" font-size="10" font-weight="600" class="font-mono">WASM engine</text>
    </g>
  </g>
</svg>
