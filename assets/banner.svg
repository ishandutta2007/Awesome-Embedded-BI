<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 70px; y: 130px; }
        50% { height: 110px; y: 90px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 130px; y: 70px; }
        50% { height: 85px; y: 115px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 95px; y: 105px; }
        50% { height: 140px; y: 60px; }
      }
      @keyframes waveDash {
        to { stroke-dashoffset: -100; }
      }
      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-orb {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-bar-1 { animation: barGrow1 4s ease-in-out infinite; }
      .anim-bar-2 { animation: barGrow2 4.5s ease-in-out infinite; }
      .anim-bar-3 { animation: barGrow3 3.8s ease-in-out infinite; }
      .anim-line {
        stroke-dasharray: 8, 4;
        animation: waveDash 10s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1280" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="80" r="180" fill="#3b82f6" fill-opacity="0.12" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="1100" cy="320" r="200" fill="#8b5cf6" fill-opacity="0.12" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="640" cy="210" r="220" fill="#06b6d4" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Left Content: Titles and Badges -->
  <g transform="translate(80, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 75)">
      <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="18" cy="16" r="5" fill="#38bdf8" filter="url(#subtleGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1">CURATED DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#primaryGrad)" filter="url(#subtleGlow)" letter-spacing="-0.5">
      Awesome Embedded BI
    </text>

    <!-- Subtitle -->
    <text x="0" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Interactive Dashboards • Headless Analytics • Semantic Layers • BI SDKs
    </text>

    <text x="0" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#64748b">
      The ultimate open-source &amp; commercial guide for customer-facing analytics
    </text>

    <!-- Tech Feature Tags -->
    <g transform="translate(0, 280)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Open Source</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(145, 0)">
        <rect width="135" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📊 Semantic APIs</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(290, 0)">
        <rect width="145" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔐 Multi-Tenancy</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(445, 0)">
        <rect width="140" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">☁️ SaaS Analytics</text>
      </g>
    </g>
  </g>

  <!-- Right Side Interactive Dashboard Mockup Card -->
  <g transform="translate(760, 60)" class="floating-card">
    <!-- Card Frame -->
    <rect width="440" height="300" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />
    
    <!-- Window Controls -->
    <circle cx="25" cy="24" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="24" r="5.5" fill="#f59e0b" />
    <circle cx="59" cy="24" r="5.5" fill="#10b981" />
    <text x="90" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">embedded-analytics-sdk.ts</text>

    <line x1="0" y1="45" x2="440" y2="45" stroke="#1e293b" stroke-width="1" />

    <!-- Mini KPI Stat Box 1 -->
    <g transform="translate(20, 60)">
      <rect width="190" height="65" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Active Tenants</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">14,820</text>
      <text x="110" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981">+24.5% ↑</text>
    </g>

    <!-- Mini KPI Stat Box 2 -->
    <g transform="translate(230, 60)">
      <rect width="190" height="65" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Query Latency (p99)</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#a78bfa">18 ms</text>
      <text x="110" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981">Ultra-Fast</text>
    </g>

    <!-- Chart Panel -->
    <g transform="translate(20, 135)">
      <rect width="400" height="145" rx="8" fill="#131d35" stroke="#1e293b" stroke-width="0.8" />
      
      <!-- Chart Grid Lines -->
      <line x1="20" y1="30" x2="380" y2="30" stroke="#1e293b" stroke-dasharray="3,3" />
      <line x1="20" y1="65" x2="380" y2="65" stroke="#1e293b" stroke-dasharray="3,3" />
      <line x1="20" y1="100" x2="380" y2="100" stroke="#1e293b" stroke-dasharray="3,3" />

      <!-- Animated Bar Chart Columns -->
      <rect x="40" y="70" width="22" height="50" rx="4" fill="url(#barGrad1)" class="anim-bar-1" />
      <rect x="75" y="45" width="22" height="75" rx="4" fill="url(#barGrad2)" class="anim-bar-2" />
      <rect x="110" y="30" width="22" height="90" rx="4" fill="url(#barGrad3)" class="anim-bar-3" />
      <rect x="145" y="55" width="22" height="65" rx="4" fill="url(#barGrad1)" class="anim-bar-2" />
      <rect x="180" y="40" width="22" height="80" rx="4" fill="url(#barGrad2)" class="anim-bar-1" />
      <rect x="215" y="25" width="22" height="95" rx="4" fill="url(#barGrad3)" class="anim-bar-3" />

      <!-- Smooth Trend Line with glowing pulse -->
      <path d="M 245 95 Q 280 40 315 70 T 380 30" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#subtleGlow)" class="anim-line" />
      <circle cx="380" cy="30" r="5" fill="#38bdf8" filter="url(#glow)" />
      
      <text x="255" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Live Analytics Feed • 60 FPS</text>
    </g>
  </g>
</svg>